
<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musaf Study App</title>
<style>
body{font-family:Arial;background:#eef4ff;margin:0;text-align:center}
header{background:#1649a5;color:white;padding:20px}
.box{background:white;margin:12px;padding:15px;border-radius:12px}
button,select{padding:12px;margin:5px;border:0;border-radius:8px;background:#1655bd;color:white}
#content{padding:12px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1>📚 M STUDY</h1>
<p>कक्षा 9 और 10 | बिहार बोर्ड</p>
</header>

<div class="box">
<h3>कक्षा चुनें</h3>
<select id="cls">
<option>कक्षा 9</option>
<option>कक्षा 10</option>
</select>
<h3>विषय चुनें</h3>
<select id="sub">
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Math</option>
</select>
<br>
<button onclick="showNotes()">नोट्स</button>
<button onclick="showTips()">पढ़ाई टिप्स</button>
<button onclick="startTest()">मॉक टेस्ट</button>
<div id="content">अपनी कक्षा और विषय चुनें।</div>
</div>

<script>
function showNotes(){
let c=cls.value,s=sub.value;
let data={
Physics:"गति, बल, गुरुत्वाकर्षण, कार्य और ऊर्जा जैसे अध्याय पढ़ें।",
Chemistry:"पदार्थ, परमाणु, अणु और रासायनिक अभिक्रियाएँ पढ़ें।",
Biology:"कोशिका, जीवन प्रक्रियाएँ और जीवों के बारे में पढ़ें।",
Math:"संख्या पद्धति, बीजगणित, ज्यामिति और सूत्रों का अभ्यास करें।"
};
content.innerText=c+" - "+s+" के नोट्स\n\n"+data[s]+"\n\nयह शुरुआती नमूना है। पूरे अध्याय के नोट्स आगे जोड़े जा सकते हैं।";
}
function showTips(){
content.innerText="पढ़ाई के टिप्स:\n1. रोज एक अध्याय पढ़ो।\n2. जरूरी सूत्र लिखो।\n3. MCQ हल करो।\n4. गलत सवाल दोबारा करो।\n5. हर रविवार टेस्ट दो।";
}

function startTest(){
let questions = [
["बल की SI इकाई?",["न्यूटन","जूल","वाट","मीटर"],0],
["कार्य की SI इकाई?",["न्यूटन","जूल","वाट","पास्कल"],1],
["चाल का सूत्र?",["समय/दूरी","दूरी/समय","बल/क्षेत्रफल","द्रव्यमान/आयतन"],1],
["गुरुत्वाकर्षण का नियम किसने दिया?",["न्यूटन","आइंस्टीन","फैराडे","ओम"],0],
["ध्वनि कहाँ नहीं चलती?",["हवा","पानी","निर्वात","लोहा"],2],
["ऊर्जा की SI इकाई?",["जूल","वाट","न्यूटन","मीटर"],0],
["विद्युत धारा की इकाई?",["वोल्ट","एम्पियर","ओम","जूल"],1],
["विभवांतर की इकाई?",["वोल्ट","वाट","एम्पियर","ओम"],0],
["प्रतिरोध की इकाई?",["ओम","वोल्ट","जूल","न्यूटन"],0],
["प्रकाश की चाल सबसे अधिक कहाँ?",["पानी","काँच","निर्वात","हवा"],2],
["अम्ल नीले लिटमस को?",["लाल करता है","नीला करता है","हरा करता है","नहीं बदलता"],0],
["क्षार लाल लिटमस को?",["लाल करता है","नीला करता है","पीला करता है","काला करता है"],1],
["पानी का रासायनिक सूत्र?",["CO2","H2O","O2","NaCl"],1],
["साधारण नमक का सूत्र?",["HCl","NaOH","NaCl","CaO"],2],
["ऑक्सीजन का संकेत?",["O","Ox","Og","On"],0],
["कार्बन डाइऑक्साइड का सूत्र?",["CO","CO2","C2O","CaO"],1],
["परमाणु के केंद्र में क्या?",["इलेक्ट्रॉन","नाभिक","कक्षा","अणु"],1],
["जंग लगने में मुख्यतः क्या चाहिए?",["ऑक्सीजन और नमी","केवल नाइट्रोजन","केवल धूप","केवल नमक"],0],
["pH 7 वाला विलयन?",["अम्लीय","क्षारीय","उदासीन","धातु"],2],
["धातु सामान्यतः कैसी होती हैं?",["ऊष्मा की सुचालक","कुचालक","गैस","पारदर्शी"],0],
["कोशिका का नियंत्रण केंद्र?",["केंद्रक","रिक्तिका","कोशिका भित्ति","झिल्ली"],0],
["प्रकाश संश्लेषण में कौन-सी गैस ली जाती है?",["ऑक्सीजन","कार्बन डाइऑक्साइड","नाइट्रोजन","हाइड्रोजन"],1],
["पौधों का हरा रंग किससे?",["हीमोग्लोबिन","क्लोरोफिल","आयोडीन","स्टार्च"],1],
["रक्त का लाल रंग किससे?",["क्लोरोफिल","हीमोग्लोबिन","प्लाज्मा","जल"],1],
["मानव हृदय में कितने कक्ष?",["दो","तीन","चार","पाँच"],2],
["श्वसन में कौन-सी गैस उपयोग होती है?",["ऑक्सीजन","नाइट्रोजन","हीलियम","हाइड्रोजन"],0],
["पौधों में जल का परिवहन?",["जाइलम","फ्लोएम","रंध्र","पंखुड़ी"],0],
["भोजन का पाचन कहाँ शुरू होता है?",["मुख","हृदय","फेफड़ा","गुर्दा"],0],
["गुर्दे का मुख्य काम?",["रक्त छानना","भोजन पचाना","देखना","सुनना"],0],
["वंशानुगत पदार्थ?",["DNA","जल","वसा","ग्लूकोज"],0],
["2 + 3 = ?",["4","5","6","7"],1],
["12 × 8 = ?",["86","96","106","98"],1],
["√81 = ?",["7","8","9","10"],2],
["5² = ?",["10","15","20","25"],3],
["त्रिभुज के कोणों का योग?",["90°","180°","270°","360°"],1],
["वृत्त का क्षेत्रफल?",["2πr","πr²","πd","r²"],1],
["समकोण कितने अंश का?",["45°","60°","90°","180°"],2],
["एक दर्जन में कितनी वस्तुएँ?",["10","12","20","24"],1],
["यदि x+5=12, तो x=?",["5","6","7","8"],2],
["15 का 20%?",["2","3","4","5"],1],
["3, 6, 9, 12 के बाद?",["13","14","15","16"],2],
["100 का वर्गमूल?",["5","10","20","50"],1],
["सबसे छोटी अभाज्य संख्या?",["0","1","2","3"],2],
["7 × 7 = ?",["42","48","49","56"],2],
["आयत का क्षेत्रफल?",["लंबाई × चौड़ाई","2 × लंबाई","लंबाई + चौड़ाई","4 × भुजा"],0],
["1 किलोमीटर में कितने मीटर?",["100","500","1000","10000"],2],
["एक सीधी रेखा का कोण?",["90°","180°","270°","360°"],1],
["π का लगभग मान?",["2.14","3.14","4.13","3.41"],1],
["यदि 2x=18, तो x=?",["6","8","9","12"],2],
["10, 20, 30 का औसत?",["10","15","20","30"],2],
["घन की कितनी भुजाएँ (किनारे)?",["6","8","12","16"],2]
];
let i=0, score=0, answered=false;
function show(){
answered=false;
if(i>=questions.length){
content.innerHTML="<h2>टेस्ट पूरा!</h2><h3>तुम्हारा स्कोर: "+score+"/50</h3><button onclick='startTest()'>फिर से टेस्ट दो</button>";
return;
}
let q=questions[i];
content.innerHTML="<h3>प्रश्न "+(i+1)+" / 50</h3><p>"+q[0]+"</p>";
q[1].forEach((a,n)=>{
let b=document.createElement("button");
b.innerText=String.fromCharCode(65+n)+". "+a;
b.style.display="block";
b.style.width="100%";
b.style.margin="8px 0";
b.onclick=function(){
if(answered)return;
answered=true;
if(n===q[2])score++;
content.innerHTML+="<p>"+(n===q[2]?"✅ सही उत्तर!":"❌ सही उत्तर: "+q[1][q[2]])+"</p>";
let next=document.createElement("button");
next.innerText=i===49?"परिणाम देखें":"अगला प्रश्न";
next.onclick=function(){i++;show();};
content.appendChild(next);
};
content.appendChild(b);
});
}
show();
}

let qs=[
{q:"बल की SI इकाई क्या है?",a:["जूल","न्यूटन","वाट","मीटर"],correct:1},
{q:"पौधों में प्रकाश संश्लेषण कहाँ होता है?",a:["जड़","क्लोरोप्लास्ट","फूल","फल"],correct:1},
{q:"2 + 3 = ?",a:["4","5","6","7"],correct:1}
];
let i=0,score=0;
function next(){
if(i>=qs.length){
content.innerText="टेस्ट पूरा!\nस्कोर: "+score+"/"+qs.length;
return;
}
let q=qs[i];
content.innerHTML="<b>प्रश्न "+(i+1)+": "+q.q+"</b><br>"+
q.a.map((v,n)=>`<button onclick="answer(${n})">${v}</button>`).join(" ");
window.answer=function(n){
if(n===q.correct)score++;
i++;next();
};
}
next();

</script>
</body>
</html>
